<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Data Viewer</title>
    <style>
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
        }
        .section {
            border: 1px solid #ccc;
            margin: 10px;
            padding: 10px;
            width: 45%;
        }
        h2 {
            font-size: 1.2rem;
            color: #004d99;
        }
        .dict-entry {
            margin-bottom: 20px;
            padding: 5px;
            border-left: 3px solid #007bff;
            background-color: #f1f1f1;
        }
        .divider {
            border-top: 2px solid #007bff;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>FM2 JSON Data</h1>
    <select id="file-selector">
        <option value="data/tfidf_checked/paraphrased.top3.merged_sec.json">TFIDF R@3</option>
        <option value="data/tfidf_checked/paraphrased.top5.merged_sec.json">TFIDF R@5</option>
        <option value="data/tfidf_checked/paraphrased.top10.merged_sec.json">TFIDF R@10</option>
        <option value="data/contriever_checked/paraphrased.top3.merged_sec.json">Contriever R@3</option>
        <option value="data/contriever_checked/paraphrased.top5.merged_sec.json">Contriever R@5</option>
        <option value="data/contriever_checked/paraphrased.top10.merged_sec.json">Contriever R@10</option>
        <!-- Add other file options here -->
    </select>
    <div id="data-container" class="container">
        <!-- Dynamic data will be inserted here -->
    </div>

    <script>
        document.getElementById('file-selector').addEventListener('change', function() {
            loadJSONData(this.value);
        });

        function loadJSONData(filePath) {
            fetch(filePath)
            .then(response => response.json())
            .then(data => displayData(data))
            .catch(error => console.error('Error fetching JSON data:', error));
        }

        function displayData(data) {
            const container = document.getElementById('data-container');
            container.innerHTML = ''; // Clear previous data
            const categories = {};
            const keysOrder = ["id", "category", "gold_evidence", "Step1 retrieve result", "ori text", 'Step 1 top k kn', "Step2 retrieve result", "text", 'Step 2 top k kn'];
            const keysAboveDivider = ["id", "category", "gold_evidence"];
            const keysAboveDivider2 = ["Step1 retrieve result", "ori text", 'Step 1 top k kn'];
            const keysBelowDivider2 = ["Step2 retrieve result", "text", 'Step 2 top k kn'];

            data.forEach(item => {
                if (!categories[item.category]) {
                    categories[item.category] = [];
                }
                categories[item.category].push(item);
            });

            for (let category in categories) {
                const section = document.createElement('div');
                section.className = 'section';
                section.innerHTML = `<h2>${category}</h2>`;

                categories[category].forEach(item => {
                    const itemElement = document.createElement('div');
                    itemElement.className = 'dict-entry';
                    let itemContent = '';
                    
                    // Process keys above the first divider
                    keysAboveDivider.forEach(key => {
                        if (key in item) {
                            itemContent += formatItemContent(key, item);
                        }
                    });
                    
                    itemContent += `<div class="divider"></div>`;
                    
                    // Process keys above the second divider (keysAboveDivider2)
                    keysAboveDivider2.forEach(key => {
                        if (key in item) {
                            itemContent += formatItemContent(key, item);
                        }
                    });

                    itemContent += `<div class="divider"></div>`;
                    
                    // Process keys below the second divider (keysBelowDivider2)
                    keysBelowDivider2.forEach(key => {
                        if (key in item) {
                            itemContent += formatItemContent(key, item);
                        }
                    });

                    itemElement.innerHTML = itemContent;
                    section.appendChild(itemElement);
                });
                container.appendChild(section);
            }
        }

        function formatItemContent(key, item) {
            if (key === 'gold_evidence' || key === 'Step 1 top k kn' || key === 'Step 2 top k kn') {
                let evidenceContent = `<strong>${key}:</strong><br>`;
                item[key].forEach((evidence, index) => {
                    evidenceContent += `<div><u>Items ${index + 1}:</u><br>`;
                    for (let evidKey in evidence) {
                        evidenceContent += `${evidKey}: ${evidence[evidKey]}<br>`;
                    }
                    evidenceContent += '</div>';
                });
                return evidenceContent;
            } else {
                return `<strong>${key}:</strong> <br> ${Array.isArray(item[key]) ? JSON.stringify(item[key]) : item[key]}<br>`;
            }
        }


        // Initially load the default selected file
        loadJSONData(document.getElementById('file-selector').value);
    </script>
</body>
</html>
